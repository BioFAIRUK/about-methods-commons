#####################################################################
# BioFAIR Method Commons — ELIXIR Toolkit Theme + BioFAIR branding
#####################################################################

title: BioFAIR Methods Commons
# Shown in the browser tab / to search engines
topnav_title: Methods Commons
# Sits next to the logo in the top navigation

description: >-
  The BioFAIR Methods Commons — UK national infrastructure for FAIR
  computational workflows in the life sciences, built on Galaxy, Nextflow
  and WorkflowHub.

url: https://stuzart.github.io      # deployed origin
baseurl: /biofair-methods-commons   # served from this sub-path (GitHub project page)

#####################################################################
# Theme
#####################################################################
# Local build / GitHub Actions / GitLab use the published gem.
theme: elixir-toolkit-theme
#
# For plain GitHub Pages (no Actions) comment out `theme:` above and
# uncomment the remote theme below instead:
# remote_theme: ELIXIR-Belgium/elixir-toolkit-theme@6.1.0

#####################################################################
# BioFAIR branding
#####################################################################
theme_variables:
  theme_color: "54A174"          # BioFAIR brand green — browser UI + manifest
  back_to_top: true
  breadcrumb: false
  topnav:
    theme: light
    brand_logo: assets/img/biofair-logo.png
    search: true
    github: false
  # Per-page edit / issue / history buttons — off until a GitHub repo
  # is configured (set these true and add `github.repository_url` below).
  github_buttons:
    edit_me: false
    open_issue: false
    history: false
  # Nunito Sans (free stand-in for the brand's Avenir Next) + PT Sans
  # Caption (matches the logo strapline).
  fonts:
    - https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,600&family=PT+Sans+Caption:wght@400;700&display=swap
  headings:
    related-pages: Related pages
    more-information-tiles: More information

#####################################################################
# Build settings
#####################################################################
sass:
  style: compressed

exclude:
  - .gitignore
  - Gemfile*
  - LICENSE
  - README.md
  - vendor
  - notes            # internal planning material — never published

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      permalink: /:basename
      layout: "page"
      sidebar: main

plugins:
  - elixir-toolkit-theme-plugins
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji
  - webrick
